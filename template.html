<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e8fe8">
<title>Hẻm Trà - Đăng nhập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ratio: 0.5625;                       /* 9:16, đúng tỉ lệ ảnh mẫu */
    --h: 100vh;
    --sw: calc(var(--h) * var(--ratio));   /* bề rộng của "sân khấu" ảnh nền */
    --ui: clamp(300px, var(--sw), 520px);  /* cỡ chuẩn để scale các thành phần */
    --text: #ffffff;
    --blue: #1b6fd1;
  }
  @supports (height: 100dvh) { :root { --h: 100dvh; } }

  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #0c4a8a;
    display: flex; justify-content: center;
    font-family: "Inter", -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  /* Khung điện thoại: tối đa 9:16, trên mobile chiếm toàn màn hình */
  .phone {
    position: relative; overflow: hidden;
    width: min(100vw, var(--sw)); height: var(--h);
    background: #1e8fe8;
  }

  /* Sân khấu: ảnh nền + mọi thành phần định vị theo % của ảnh, nên luôn khớp nhau */
  .stage {
    position: absolute; top: 0;
    width: var(--sw); height: 100%;
    left: min(0px, calc(100% - var(--sw) * 0.96));   /* màn dài hơn 9:16 thì cắt bên trái, giữ form bên phải */

  .card {
    position: absolute;
    left: 52.7%; top: 42.6%; width: 41.3%;
    padding: calc(var(--ui) * .034);
    display: flex; flex-direction: column; gap: calc(var(--ui) * .022);
    border-radius: calc(var(--ui) * .062);
    background: linear-gradient(160deg, rgba(255,255,255,.34), rgba(255,255,255,.16));
    border: 1.5px solid rgba(255,255,255,.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6),
                0 10px 30px rgba(10, 70, 140, .18);
    -webkit-backdrop-filter: blur(14px) saturate(1.15);
            backdrop-filter: blur(14px) saturate(1.15);
  }

  .field {
    --h-field: clamp(38px, calc(var(--ui) * .086), 50px);
    height: var(--h-field);
    display: flex; align-items: center;
    border-radius: calc(var(--h-field) * .36);
    border: 1px solid rgba(255,255,255,.6);
    background: rgba(255,255,255,.10);
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .field:focus-within {
    border-color: #fff; background: rgba(255,255,255,.2);
    box-shadow: 0 0 0 3px rgba(255,255,255,.28);
  }
  .field .ico {
    flex: none; width: 17%; min-width: 34px; height: 56%;
    display: grid; place-items: center;
    border-right: 1px solid rgba(255,255,255,.4);
    color: rgba(255,255,255,.95);
  }
  .field .ico svg { width: 52%; max-width: 20px; min-width: 15px; height: auto; }

  .field input {
    flex: 1; min-width: 0; height: 100%;
    padding: 0 calc(var(--ui) * .03);
    background: transparent; border: 0; outline: 0;
    color: var(--text);
    font-family: inherit; font-weight: 500;
    font-size: clamp(12px, calc(var(--ui) * .031), 15px);
    letter-spacing: .01em;
  }
  .field input::placeholder { color: rgba(255,255,255,.88); opacity: 1; }
  .field input:-webkit-autofill {
    -webkit-text-fill-color: #fff;
    transition: background-color 9999s;
  }

  .toggle {
    flex: none; width: clamp(30px, calc(var(--ui) * .075), 38px); height: 100%;
    margin-right: 2px;
    display: grid; place-items: center;
    background: none; border: 0; cursor: pointer; color: rgba(255,255,255,.95);
    border-radius: 12px;
  }
  .toggle svg { width: 52%; max-width: 20px; min-width: 15px; height: auto; }
  .toggle .off { display: none; }
  .toggle[aria-pressed="true"] .on  { display: none; }
  .toggle[aria-pressed="true"] .off { display: block; }

  .submit {
    margin-top: calc(var(--ui) * .006);
    height: clamp(38px, calc(var(--ui) * .086), 50px);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; cursor: pointer;
    border-radius: calc(clamp(38px, calc(var(--ui) * .086), 50px) * .5);
    background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(214,234,255,.86));
    color: var(--blue);
    font-family: inherit; font-weight: 600;
    font-size: clamp(12.5px, calc(var(--ui) * .032), 15.5px);
    box-shadow: 0 4px 14px rgba(20, 90, 180, .18), inset 0 1px 0 #fff;
    transition: transform .15s, box-shadow .2s;
  }
  .submit svg { width: 1.15em; height: 1.15em; transition: transform .2s; }
  .submit:hover svg { transform: translateX(3px); }
  .submit:active { transform: scale(.98); }

  .field:focus-visible, .toggle:focus-visible, .submit:focus-visible {
    outline: 2px solid #fff; outline-offset: 2px;
  }

  .shake { animation: shake .35s; border-color: #ffd1d1 !important; }
  @keyframes shake {
    20% { transform: translateX(-5px); } 40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); } 80% { transform: translateX(3px); }
  }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } .submit svg { transition: none; } }
</style>
</head>
<body>
  <main class="phone">
    <div class="stage">
      <div class="logo" role="img" aria-label="Hẻm Trà"></div>

      <form class="card" id="login" novalidate autocomplete="on">
        <label class="field" id="f-user">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="4"/><path d="M4 21c0-4.4 3.6-7.5 8-7.5s8 3.1 8 7.5"/></svg>
          </span>
          <input id="user" name="username" type="text" placeholder="Tài khoản" autocomplete="username" aria-label="Tài khoản">
        </label>

        <label class="field" id="f-pass">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.7" r="1.1" fill="currentColor"/></svg>
          </span>
          <input id="pass" name="password" type="password" placeholder="Mật khẩu" autocomplete="current-password" aria-label="Mật khẩu">
          <button type="button" class="toggle" id="toggle" aria-pressed="false" aria-label="Hiện mật khẩu">
            <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m3 3 18 18"/></svg>
          </button>
        </label>

        <button class="submit" type="submit">
          Đăng nhập
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
        </button>
      </form>
    </div>
  </main>

<script>
  const pass = document.getElementById('pass');
  const toggle = document.getElementById('toggle');
  toggle.addEventListener('click', () => {
    const show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    toggle.setAttribute('aria-pressed', show);
    toggle.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
  });

  document.getElementById('login').addEventListener('submit', (e) => {
    e.preventDefault();
    const fields = [['user', 'f-user'], ['pass', 'f-pass']];
    let ok = true;
    fields.forEach(([i, f]) => {
      const el = document.getElementById(f);
      el.classList.remove('shake');
      if (!document.getElementById(i).value.trim()) {
        ok = false; void el.offsetWidth; el.classList.add('shake');
      }
    });
    if (!ok) return;
    // TODO: gọi API đăng nhập tại đây
    console.log('Đăng nhập:', document.getElementById('user').value);
  });
</script>
